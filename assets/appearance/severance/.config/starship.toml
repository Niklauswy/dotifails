format = ' 📚 [$output]($style) '


# Show the checkout used by the current terminal. Codex-managed worktrees get
# their short directory id so parallel chats are easy to distinguish.
[custom.codex_git_context]
description = 'Local checkout or Codex worktree plus the active Git ref'
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = '''
git_dir="$(git rev-parse --git-dir 2>/dev/null)"
common_dir="$(git rev-parse --git-common-dir 2>/dev/null)"

if [ "$git_dir" = "$common_dir" ]; then
  scope="LOCAL"
else
  scope="WORKTREE"
  root="$(git rev-parse --show-toplevel 2>/dev/null)"
  case "$root" in
    */.codex/worktrees/*)
      worktree_id="${root#*/.codex/worktrees/}"
      worktree_id="${worktree_id%%/*}"
      scope="WORKTREE:${worktree_id}"
      ;;
  esac
fi

branch="$(git symbolic-ref --quiet --short HEAD 2>/dev/null || true)"
if [ -n "$branch" ]; then
  ref="$branch"
else
  ref="DETACHED@$(git rev-parse --short=7 HEAD 2>/dev/null)"
fi

printf '%s · %s' "$scope" "$ref"
'''
format = 'on [🧭 $output]($style) '
style = 'bold purple'
shell = ['sh']
