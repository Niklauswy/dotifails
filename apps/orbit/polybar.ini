[colors]
bg = #A6101118
fg = #EBECF3
muted = #999AA8
accent = #B8C8FA

[bar/base]
monitor = ${env:MONITOR:}
monitor-strict = true
height = 36
offset-y = 10
radius = 12
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = Inter:size=10;2
font-1 = Symbols Nerd Font Mono:size=13;3
font-2 = DejaVu Sans:size=10;2
padding = 2
module-margin = 1
wm-restack = bspwm
override-redirect = false
enable-ipc = true
line-size = 0
border-size = 1
border-color = #334E5268

[bar/left]
inherit = bar/base
width = 20%
offset-x = 1%
modules-left = orbit title

[bar/center]
inherit = bar/base
width = 14%
offset-x = 43%
modules-center = bspwm

[bar/right]
inherit = bar/base
width = 26%
offset-x = 73%
modules-right = resources network volume battery date notifications power tray

[bar/right-secondary]
inherit = bar/right
modules-right = resources network volume battery date notifications power

[module/orbit]
type = custom/text
format = %{T2}󰀻%{T-}  Órbita
format-foreground = ${colors.accent}
click-left = ~/.local/bin/orbit toggle
click-right = ~/.local/bin/orbit clipboard

[module/title]
type = internal/xwindow
label = %title%
label-maxlen = 27
label-empty = Escritorio
label-foreground = ${colors.muted}

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
format = <label-state>
label-focused = %name%
label-focused-foreground = ${colors.accent}
label-focused-background = #334E648F
label-focused-padding = 2
label-occupied = %name%
label-occupied-padding = 2
label-occupied-foreground = ${colors.fg}
label-empty = ·
label-empty-padding = 2
label-empty-foreground = ${colors.muted}
label-urgent = %name%
label-urgent-foreground = #F28B96
label-urgent-padding = 2

[module/resources]
type = custom/script
exec = ~/.local/bin/orbit-bar-status resources
interval = 3
click-left = ~/.local/bin/orbit system

[module/network]
type = custom/script
exec = ~/.local/bin/orbit-bar-status network
interval = 5
click-left = ~/.local/bin/orbit network

[module/volume]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = %{T2}󰕾%{T-} %percentage%%
label-muted = %{T2}󰝟%{T-}
label-muted-foreground = ${colors.muted}
click-right = ~/.local/bin/orbit audio

[module/battery]
type = custom/script
exec = ~/.local/bin/orbit-bar-status battery
interval = 15
click-left = ~/.local/bin/orbit system

[module/date]
type = custom/script
exec = date '+%d %b  %H:%M'
interval = 10
click-left = ~/.local/bin/orbit calendar

[module/notifications]
type = custom/script
exec = ~/.local/bin/orbit-bar-status notifications
interval = 5
click-left = ~/.local/bin/orbit notifications
click-right = dunstctl set-paused toggle

[module/power]
type = custom/text
format = %{T2}⏻%{T-}
format-foreground = ${colors.muted}
click-left = ~/.local/bin/orbit power

[module/tray]
type = internal/tray
tray-spacing = 5
tray-size = 15

[settings]
screenchange-reload = true
pseudo-transparency = false
