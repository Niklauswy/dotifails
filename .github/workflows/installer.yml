name: Installer

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-installer:
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      ORBIT_REDUCED_MOTION: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Native test dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends python3 python3-pyside6.qtwidgets python3-pyside6.qtsvg python3-dbus python3-gi python3-xlib python3-pil bat git ca-certificates
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Component selection and recovery
        run: python3 -m unittest discover -s tests -p test_visual_installer.py -v
      - name: Boot preservation and rollback
        run: python3 -m unittest discover -s tests -p test_boot.py -v
      - name: Native wizard and real configuration installation
        run: python3 tests/installer_ui.py
      - name: Portable manifest and whitespace
        run: |
          python3 tests/check_manifest.py
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --check
