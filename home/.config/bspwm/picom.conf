# Picom 12.5 — Órbita Desktop.
backend = "glx";
vsync = true;
use-damage = true;
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.25;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#080b14";
corner-radius = 12;
blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
log-level = "warn";
# Keep text opaque: Ghostty controls its own background alpha.
rules = (
  { match = "class_g = 'Orbit'"; corner-radius = 15; shadow = true; blur-background = true; },
  { match = "window_type = 'normal' && !fullscreen";
    animations = (
      { triggers = [ "open", "show" ]; preset = "appear"; duration = 0.12; scale = 0.98; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.10; scale = 0.97; },
      { triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.12; }
    );
  },
  { match = "class_g = 'Polybar' || window_type = 'dock' || window_type = 'desktop'";
    shadow = false; corner-radius = 0; blur-background = true;
  },
  { match = "fullscreen"; corner-radius = 0; shadow = false; blur-background = false; }
);
