"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
scan_timeout = 20
command_timeout = 500
format = "$directory$git_branch$git_status$nodejs$python$c$cmd_duration$line_break$character"

[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #9ece6a)"

[directory]
style = "bold #7aa2f7"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "#bb9af7"

[git_status]
style = "#e0af68"

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"

[python]
symbol = " "
format = "[$symbol($version )($virtualenv )]($style)"

[c]
symbol = " "
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "

[package]
disabled = true
