<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selector de archivos · Wysun Files · Material 3 Expressive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link rel="stylesheet" href="music-shared.css">
<link rel="stylesheet" href="music-screens.css">
<link rel="stylesheet" href="files-screens.css">
</head>
<body>
<div id="doc"></div>
<script src="music-shared.js"></script>
<script src="files-shared.js"></script>
<script>
const PAGES = [['files-folder.html', 'Carpeta'], ['files-details.html', 'Vista previa'], ['files-dialogs.html', 'Operaciones y diálogos'], ['files-chooser.html', 'Selector de archivos']];
const ms = FX.ms, F = FX.files;
const sec = (id, h, sub, inner) => `<section id="${id}"><h2>${h}</h2><p class="sub">${sub}</p>${inner}</section>`;
const lbl = (t) => `<div class="lbl">${t}</div>`;
const grid = (o = {}) => `${FX.hero(o.hero || {})}${FX.filters(o.filter)}<div class="fgrid">${(o.files || F).map((f, i) => FX.tile(f, { sel: (o.sel || []).includes(i), cut: (o.cut || []).includes(i), seed: i })).join('')}</div>`;
const list = (o = {}) => `${FX.hero(o.hero || {})}${FX.filters(o.filter)}<div class="flist"><div class="head"><span></span><span>Nombre ${ms('arrow_upward', 0, 's18')}</span><span class="date">Modificado</span><span>Tamaño</span><span class="type">Tipo</span></div>${(o.files || F).map((f, i) => FX.row(f, { sel: (o.sel || []).includes(i), seed: i })).join('')}</div>`;
const three = (content, extra = {}) => `<div class="widths3">
  <div>${lbl('Compacto · &lt; 600 px · drawer modal desde el menú')}${FX.win({ content, width: 400, navOpen: true, ...extra })}</div>
  <div>${lbl('Medio · 600–839 px · rail de 80 px')}${FX.win({ content, width: 720, ...extra })}</div>
  <div>${lbl('Amplio · ≥ 840 px · drawer estándar de 280 px')}${FX.win({ content, width: 1040, ...extra })}</div></div>`;
const foot = (o) => `<div class="chooser-foot">${o.name ? `<div class="field focus"><label>Nombre</label>${o.name}</div>` : `<span style="flex:1;font-size:13px;color:var(--m3-on-surface-variant)">${o.note || ''}</span>`}${o.filter ? `<span class="dropdown">${ms('filter_list', 0, 's18')}${o.filter}${ms('arrow_drop_down')}</span>` : ''}<span class="btn text">Cancelar</span><span class="btn filled">${o.accept}</span></div>`;
const chooser = (o) => `<div class="m3" data-palette="${o.palette || 'grafito'}" data-mode="${o.mode || 'dark'}"><div class="win fwin tall" style="width:${o.width || 1040}px">${o.navHtml || ''}
  <div class="main" style="display:flex;flex-direction:column"><header class="topbar" style="padding:16px 20px 4px"><b style="font-size:20px;font-weight:500">${o.title} — Wysun Selector</b></header>${FX.topbar(o.top || {})}
  <div class="fbody"><div class="content">${o.content}</div></div>${o.choices ? `<div class="chooser-foot" style="border-top:0;padding-bottom:0"><div class="choices">${o.choices}</div></div>` : ''}${foot(o)}</div>${o.overlay || ''}</div></div>`;
const docs = [F[6], F[7], F[0], F[1]];
const DOC = `<h1>Wysun Files · selector de archivos</h1>
<p class="sub">El mismo Files en modo selector: para el portal <code>org.freedesktop.impl.portal.FileChooser</code> (cualquier app) y para el PDF de Wysun. Sin acciones destructivas ni pestañas; título «… — Wysun Selector»; filtros del portal (glob y MIME) con desplegable, opciones del portal (combos y casillas), Enter entra en la carpeta o acepta. Guardar propone el nombre y pide confirmación antes de reemplazar; nunca escribe el archivo.</p>
${sec('abrir', 'Abrir (varios archivos, con filtro)', 'Ctrl A solo en selección múltiple; las carpetas siempre visibles.', FX.win({ width: 1, content: '', fixed: true, cls: 'short' }).replace(/.*/s, '') + chooser({ title: 'Adjuntar archivos', accept: 'Abrir', filter: 'Imágenes (png, jpg, webp)', note: '2 seleccionados', content: grid({ sel: [8, 9], filter: 'img', files: [F[0], F[1], F[8], F[9]] }) }))}
${sec('guardar', 'Guardar (con confirmación de reemplazo)', 'Nombre editable con el sufijo por defecto; error si es una carpeta o sin permiso de escritura.', `<div class="stack">${chooser({ title: 'Guardar documento', accept: 'Guardar', name: 'tesis.pdf', filter: 'PDF', content: grid({ files: docs }) })}
  ${chooser({ title: 'Guardar documento', accept: 'Guardar', name: 'tesis.pdf', filter: 'PDF', content: grid({ files: docs, sel: [0] }), overlay: `<div class="overlay"><div class="dialog">${ms('warning', 1, 's32 ico')}<h4 style="text-align:center">¿Reemplazar «tesis.pdf»?</h4><p style="text-align:center">Ya existe en «clases». La app que lo guarda lo sobrescribirá.</p><div class="acts"><span class="btn text">Cancelar</span><span class="btn danger tonal" style="background:var(--m3-error-container)">Reemplazar</span></div></div></div>` })}</div>`)}
${sec('carpeta', 'Elegir carpeta y opciones del portal', 'Modo carpeta (directory=true) y las «choices» del portal como desplegable y casilla.', chooser({ title: 'Elegir carpeta de descargas', accept: 'Seleccionar', note: 'Carpeta: clases', content: grid({ files: F.slice(0, 6) }), choices: `<span class="dropdown">Codificación: UTF-8${ms('arrow_drop_down')}</span><span><span class="checkbox on">${ms('check', 0, 's18')}</span> Incluir subcarpetas</span>` }))}
${sec('estrecho', 'Ventanas estrechas', 'Debajo de 600 px el selector usa la lista y el drawer modal.', chooser({ width: 420, title: 'Abrir', accept: 'Abrir', content: list({ files: docs }), top: { list: true } }))}`;
document.getElementById('doc').innerHTML = MX.controls(PAGES, 'files-chooser.html') + '<div class="doc">' + DOC + '</div>';
</script>
</body>
</html>
