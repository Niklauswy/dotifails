<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Álbum, lista y artista · Wysun Music · Material 3 Expressive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link rel="stylesheet" href="music-shared.css">
<link rel="stylesheet" href="music-screens.css">
</head>
<body>
<div id="doc"></div>
<script src="music-shared.js"></script>
<script src="music-screens.js"></script>
<script>
const PAGES = [['music-library.html', 'Biblioteca'], ['music-album.html', 'Álbum / lista / artista'], ['music-player.html', 'Reproductor y cola'], ['music-search.html', 'Búsqueda y añadir música']];
const S = MX.screens, ms = MX.ms;
const sec = (id, h, sub, inner) => `<section id="${id}"><h2>${h}</h2><p class="sub">${sub}</p>${inner}</section>`;
const lbl = (t) => `<div class="lbl">${t}</div>`;

MX.onTab = (section, tab) => {
  const win = section.closest('.win'); win.querySelector('.content').innerHTML = S.library(tab);
};
const three = (route, content, extra = {}) => `<div class="widths3">
  <div>${lbl('Compacto · &lt; 600 px · drawer modal desde el botón de menú')}${MX.win({ route, content, width: 400, navOpen: true, ...extra })}</div>
  <div>${lbl('Medio · 600–839 px · navigation rail 80 px')}${MX.win({ route, content, width: 720, ...extra })}</div>
  <div>${lbl('Amplio · ≥ 840 px · navigation drawer estándar 280 px')}${MX.win({ route, content, width: 1040, ...extra })}</div></div>`;
const gallery = [['grafito', 'Grafito (tu wallpaper)'], ['indigo', 'Índigo'], ['ambar', 'Ámbar'], ['salvia', 'Salvia']].map(([p, name]) =>
  ['dark', 'light'].map((m) => `<div>${lbl(name + ' · ' + (m === 'dark' ? 'oscuro' : 'claro'))}<div style="zoom:.5">${MX.win({ route: 'home', content: S.home(), width: 1040, fixed: true, palette: p, mode: m, cls: 'short' })}</div></div>`).join('')).join('');
const DOC = `<h1>Wysun Music · álbum, lista y artista</h1>
<p class="sub">Cabecera con la portada en una forma expresiva (squircle para álbumes, cookie con iniciales o foto para artistas, sol para Tus me gusta, estallido para Recientes) sobre un velo de su color. Reproducir pasa de círculo a cuadrado redondeado mientras suena. La tabla conserva columnas, corazón, «más» y el filtro y orden de la lista (M-29).</p>
${sec('album', 'Álbum en los tres anchos', 'Cabecera que se compacta al desplazar (M-25), Reproducir · Aleatorio · Más, tabla de canciones con la que suena marcada.', three('albums', S.collection('album')))}
${sec('tipos', 'Lista, artista, Tus me gusta y Recientes', 'Mismo esqueleto; cambian la forma y el color del emblema. El artista muestra sus álbumes y sus canciones.', `<div class="stack">${lbl('Tu playlist · amplio')}${MX.win({ route: 'pl0', content: S.collection('user'), width: 1040, cls: 'tall' })}
  ${lbl('Artista · amplio')}${MX.win({ route: 'artists', content: S.collection('artist'), width: 1040, cls: 'tall' })}
  <div class="widths3" style="grid-template-columns:720px 720px">${lbl('Tus me gusta · medio')}${lbl('Recientes · medio')}${MX.win({ route: 'favs', content: S.collection('favorites'), width: 720, cls: 'tall' })}${MX.win({ route: 'recent', content: S.collection('recent'), width: 720, cls: 'tall' })}</div></div>`)}
${sec('menus', 'Menús y diálogos', 'Menú de canción (M-35: reproducir a continuación, cola, playlist, me gusta, ir al artista, mostrar en la carpeta con FileManager1) y de colección (M-37). Diálogos de nueva playlist y de borrar con confirmación.', `<div class="widths3" style="grid-template-columns:1040px">
  ${lbl('Menú de canción')}${MX.win({ route: 'albums', content: S.collection('album'), width: 1040, cls: 'tall', overlay: S.trackMenu() })}
  ${lbl('Menú de colección')}${MX.win({ route: 'pl0', content: S.collection('user'), width: 1040, cls: 'tall', overlay: S.collectionMenu() })}
  ${lbl('Nueva playlist')}${MX.win({ route: 'pl0', content: S.collection('user'), width: 1040, cls: 'tall', overlay: S.dlgNew() })}
  ${lbl('Borrar playlist')}${MX.win({ route: 'pl0', content: S.collection('user'), width: 1040, cls: 'tall', overlay: S.dlgDelete() })}</div>`)}
${sec('seleccion', 'Selección en la lista', 'Ctrl/Mayús+clic o pulsación larga: barra contextual sobre la cabecera (M-33).', MX.win({ route: 'albums', content: S.collection('album', { sel: [1, 2, 4], select: true }), width: 1040, cls: 'tall', floating: S.selbar(3) }))}`;
document.getElementById('doc').innerHTML = MX.controls(PAGES, 'music-album.html') + '<div class="doc">' + DOC + '</div>';
</script>
</body>
</html>
