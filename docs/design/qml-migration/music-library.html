<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca y navegación · Wysun Music · Material 3 Expressive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link rel="stylesheet" href="music-shared.css">
<link rel="stylesheet" href="music-screens.css">
</head>
<body>
<div id="doc"></div>
<script src="music-shared.js"></script>
<script src="music-screens.js"></script>
<script>
const PAGES = [['music-library.html', 'Biblioteca'], ['music-album.html', 'Álbum / lista / artista'], ['music-player.html', 'Reproductor y cola'], ['music-search.html', 'Búsqueda y añadir música']];
const S = MX.screens, ms = MX.ms;
const sec = (id, h, sub, inner) => `<section id="${id}"><h2>${h}</h2><p class="sub">${sub}</p>${inner}</section>`;
const lbl = (t) => `<div class="lbl">${t}</div>`;

MX.onTab = (section, tab) => {
  const win = section.closest('.win'); win.querySelector('.content').innerHTML = S.library(tab);
};
const three = (route, content, extra = {}) => `<div class="widths3">
  <div>${lbl('Compacto · &lt; 600 px · drawer modal desde el botón de menú')}${MX.win({ route, content, width: 400, navOpen: true, ...extra })}</div>
  <div>${lbl('Medio · 600–839 px · navigation rail 80 px')}${MX.win({ route, content, width: 720, ...extra })}</div>
  <div>${lbl('Amplio · ≥ 840 px · navigation drawer estándar 280 px')}${MX.win({ route, content, width: 1040, ...extra })}</div></div>`;
const gallery = [['grafito', 'Grafito (tu wallpaper)'], ['indigo', 'Índigo'], ['ambar', 'Ámbar'], ['salvia', 'Salvia']].map(([p, name]) =>
  ['dark', 'light'].map((m) => `<div>${lbl(name + ' · ' + (m === 'dark' ? 'oscuro' : 'claro'))}<div style="zoom:.5">${MX.win({ route: 'home', content: S.home(), width: 1040, fixed: true, palette: p, mode: m, cls: 'short' })}</div></div>`).join('')).join('');
const DOC = `<h1>Wysun Music · biblioteca y navegación</h1>
<p class="sub">Rediseño Material 3 Expressive (no traducción fiel). La ventana responde a su propio ancho: arrastra la esquina inferior derecha de cualquier ventana para ver cómo cambia entre drawer modal, rail y drawer estándar. Colores = roles M3 (<code>surfaceContainerLow</code>, <code>secondaryContainer</code>…); medidas = tokens oficiales (indicador del drawer 56 px, rail 80 px con indicador 56×32, búsqueda 56 px, chips 32 px / esquina 8). Libertades expresivas: formas cookie / sunny / trébol / flor con 96 vértices (se funden entre sí), muelles <code>expressiveFastSpatial</code>, play que pasa de círculo a cuadrado redondeado, onda de progreso. Usa la barra superior para cambiar paleta, modo claro/oscuro y mostrar los IDs de la lista de paridad.</p>
${sec('nav', 'Navegación adaptable en los tres anchos', 'Mismo contenido (Inicio). Atrás/adelante, búsqueda global (<kbd>Ctrl K</kbd>), ocultar (la música sigue), atajos F1; cápsula del reproductor abajo. En el rail los destinos se agrupan: Inicio · Explorar · Biblioteca · Listas · Añadir; el drawer mantiene los cinco de «Biblioteca» y las playlists con su portada y ecualizador en la que suena.', three('home', S.home()))}
${sec('biblioteca', 'Biblioteca: álbumes · artistas · canciones · listas', 'Las pestañas sustituyen a las cuatro entradas de la barra lateral actual; «Recientes» y «Tus me gusta» son chips de filtro y tarjetas inteligentes en Listas. Haz clic en las pestañas.', `<div class="stack">${lbl('Amplio (sigue el control de ancho)')}<div data-w>${MX.win({ route: 'albums', content: S.library('albums'), width: 1040, cls: 'wvar tall' })}</div>
  ${lbl('Medio · canciones')}${MX.win({ route: 'songs', content: S.library('songs'), width: 720, cls: 'tall' })}
  ${lbl('Compacto · listas')}${MX.win({ route: 'pl0', content: S.library('lists'), width: 400, cls: 'tall' })}</div>`)}
${sec('seleccion', 'Selección múltiple', 'Mantén pulsada una fila / <kbd>Ctrl</kbd>+clic: aparece la barra contextual (reproducir a continuación, cola, playlist, me gusta) sobre la cabecera. Las filas seleccionadas usan <code>secondaryContainer</code>. En cuadrículas se marca con un anillo y una insignia.', `<div class="widths3" style="grid-template-columns:720px 1040px">
  <div>${lbl('Canciones seleccionadas')}${MX.win({ route: 'songs', content: S.library('songs', { sel: [1, 2, 4], select: true }), width: 720, cls: 'tall', floating: S.selbar(3) })}</div>
  <div>${lbl('Álbumes seleccionados')}${MX.win({ route: 'albums', content: S.library('albums', { selectAlbums: true }), width: 1040, cls: 'tall', floating: S.selbar(2) })}</div></div>`)}
${sec('vacios', 'Estados vacíos', 'Una forma expresiva que se balancea (respeta movimiento reducido), un titular y una acción. Cubren biblioteca vacía, sin resultados, lista inexistente, sin favoritos y cola vacía.', `<div class="widths3" style="grid-template-columns:repeat(3,minmax(300px,1fr))">${['library', 'search', 'gone', 'favs', 'queue'].map((k) => `<div class="m3" data-palette="grafito" data-mode="dark"><div class="statebox">${S.empty(k)}</div></div>`).join('')}</div>`)}
${sec('paletas', 'Claro y oscuro · cuatro paletas', 'La paleta sale del wallpaper (aquí: gris del escritorio actual, índigo, ámbar y salvia). Todo son roles M3: nada tiene un color propio salvo las carátulas.', `<div style="display:grid;grid-template-columns:520px 520px;gap:8px 20px;overflow-x:auto">${gallery}</div>`)}`;

document.getElementById('doc').innerHTML = MX.controls(PAGES, 'music-library.html') + '<div class="doc">' + DOC + '</div>';
</script>
</body>
</html>
