<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Búsqueda y añadir música · Wysun Music · Material 3 Expressive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link rel="stylesheet" href="music-shared.css">
<link rel="stylesheet" href="music-screens.css">
</head>
<body>
<div id="doc"></div>
<script src="music-shared.js"></script>
<script src="music-screens.js"></script>
<script>
const PAGES = [['music-library.html', 'Biblioteca'], ['music-album.html', 'Álbum / lista / artista'], ['music-player.html', 'Reproductor y cola'], ['music-search.html', 'Búsqueda y añadir música']];
const S = MX.screens, ms = MX.ms;
const sec = (id, h, sub, inner) => `<section id="${id}"><h2>${h}</h2><p class="sub">${sub}</p>${inner}</section>`;
const lbl = (t) => `<div class="lbl">${t}</div>`;

MX.onTab = (section, tab) => {
  const win = section.closest('.win'); win.querySelector('.content').innerHTML = S.library(tab);
};
const three = (route, content, extra = {}) => `<div class="widths3">
  <div>${lbl('Compacto · &lt; 600 px · drawer modal desde el botón de menú')}${MX.win({ route, content, width: 400, navOpen: true, ...extra })}</div>
  <div>${lbl('Medio · 600–839 px · navigation rail 80 px')}${MX.win({ route, content, width: 720, ...extra })}</div>
  <div>${lbl('Amplio · ≥ 840 px · navigation drawer estándar 280 px')}${MX.win({ route, content, width: 1040, ...extra })}</div></div>`;
const gallery = [['grafito', 'Grafito (tu wallpaper)'], ['indigo', 'Índigo'], ['ambar', 'Ámbar'], ['salvia', 'Salvia']].map(([p, name]) =>
  ['dark', 'light'].map((m) => `<div>${lbl(name + ' · ' + (m === 'dark' ? 'oscuro' : 'claro'))}<div style="zoom:.5">${MX.win({ route: 'home', content: S.home(), width: 1040, fixed: true, palette: p, mode: m, cls: 'short' })}</div></div>`).join('')).join('');
const DOC = `<h1>Wysun Music · búsqueda, explorar y añadir música</h1>
<p class="sub">La búsqueda global (Ctrl F / Ctrl K, M-15) es la search bar M3 de 56 px en la barra superior. Vacía muestra Explorar; con texto, resultado principal, canciones, artistas y playlists/álbumes. Escape la limpia; ↓ o Enter bajan a los resultados (M-18).</p>
${sec('resultados', 'Resultados en los tres anchos', 'Resultado principal en cookie, «Ver todas» las canciones.', three('search', S.search('results'), { search: { typed: 'lucía', focus: true } }))}
${sec('explorar', 'Explorar (búsqueda vacía)', 'Mosaicos de colecciones de la biblioteca (M-16).', MX.win({ route: 'search', content: S.search('browse'), width: 1040, cls: 'tall', search: { focus: true } }))}
${sec('sinres', 'Sin resultados', 'Estado vacío expresivo.', MX.win({ route: 'search', content: S.empty('search'), width: 720, search: { typed: 'zzzz', focus: true } }))}
${sec('anadir', 'Añadir música', 'Importar archivos o carpetas (Ctrl O) y descargas: misma funcionalidad que hoy, en tarjetas y lista M3.', MX.win({ route: 'downloads', content: S.downloads(), width: 1040, cls: 'tall' }))}
${sec('atajos', 'Atajos (F1)', 'Lista del código actual (M-30) más las «nuevas» propuestas.', MX.win({ route: 'home', content: S.home(), width: 1040, cls: 'tall', overlay: S.shortcuts() }))}`;
document.getElementById('doc').innerHTML = MX.controls(PAGES, 'music-search.html') + '<div class="doc">' + DOC + '</div>';
</script>
</body>
</html>
